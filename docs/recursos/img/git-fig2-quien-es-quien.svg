<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="Quién es quién: Git es un programa de tu equipo, GitHub una web que guarda tu repositorio, el aula de código reparte la tarea y crea tu repositorio, y Classroom da los avisos y el enlace"><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="760" height="200" fill="white"/><rect x="16" y="16" width="170" height="168" rx="8" fill="white" stroke="#2f5aa8" stroke-width="1.6"/><path d="M16,72 L16,24 Q16,16 24,16 L178,16 Q186,16 186,24 L186,72 z" fill="#e3ecfa" stroke="#2f5aa8" stroke-width="1.6"/><text x="101.0" y="42" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a">Git</text><text x="101.0" y="61" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-style="italic" fill="#1a1a1a">un programa</text><text x="101.0" y="98" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">Está instalado en tu</text><text x="101.0" y="116" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">equipo. Guarda versiones</text><text x="101.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">de tu trabajo y las</text><text x="101.0" y="152" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">envía.</text><rect x="202" y="16" width="170" height="168" rx="8" fill="white" stroke="#2e7d32" stroke-width="1.6"/><path d="M202,72 L202,24 Q202,16 210,16 L364,16 Q372,16 372,24 L372,72 z" fill="#e2f3e4" stroke="#2e7d32" stroke-width="1.6"/><text x="287.0" y="42" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a">GitHub</text><text x="287.0" y="61" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-style="italic" fill="#1a1a1a">una web</text><text x="287.0" y="98" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">Guarda en internet la</text><text x="287.0" y="116" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">copia de tu repositorio.</text><text x="287.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">Entras con la cuenta</text><text x="287.0" y="152" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">de tu alias.</text><rect x="388" y="16" width="170" height="168" rx="8" fill="white" stroke="#9a6a00" stroke-width="1.6"/><path d="M388,72 L388,24 Q388,16 396,16 L550,16 Q558,16 558,24 L558,72 z" fill="#fdf0cf" stroke="#9a6a00" stroke-width="1.6"/><text x="473.0" y="42" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a">Aula de código</text><text x="473.0" y="61" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-style="italic" fill="#1a1a1a">Classroom 50</text><text x="473.0" y="98" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">Reparte cada tarea y</text><text x="473.0" y="116" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">crea en GitHub tu</text><text x="473.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">repositorio para</text><text x="473.0" y="152" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">esa tarea.</text><rect x="574" y="16" width="170" height="168" rx="8" fill="white" stroke="#555555" stroke-width="1.6"/><path d="M574,72 L574,24 Q574,16 582,16 L736,16 Q744,16 744,24 L744,72 z" fill="#f1f1f1" stroke="#555555" stroke-width="1.6"/><text x="659.0" y="42" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a">Classroom</text><text x="659.0" y="61" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-style="italic" fill="#1a1a1a">el de siempre</text><text x="659.0" y="98" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">Avisos, fechas y el</text><text x="659.0" y="116" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">enlace para aceptar</text><text x="659.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">cada tarea. Aquí no</text><text x="659.0" y="152" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">se sube el trabajo.</text></svg>
