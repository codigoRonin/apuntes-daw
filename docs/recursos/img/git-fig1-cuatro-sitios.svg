<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 225" role="img" aria-label="Los cuatro sitios por los que pasa tu trabajo: tu carpeta, preparado con git add, guardado con git commit y GitHub con git push"><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="760" height="225" fill="white"/><rect x="6" y="70" width="124" height="100" rx="8" fill="#f1f1f1" stroke="#555555" stroke-width="1.6"/><text x="68.0" y="100" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a">Tu carpeta</text><text x="68.0" y="126" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">lo que ves en</text><text x="68.0" y="143" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">el Explorador</text><line x1="134" y1="120.0" x2="210" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#f)"/><text x="172.0" y="108.0" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#1a1a1a">git add</text><rect x="214" y="70" width="124" height="100" rx="8" fill="#fdf0cf" stroke="#9a6a00" stroke-width="1.6"/><text x="276.0" y="100" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a">Preparado</text><text x="276.0" y="126" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">lo que irá en el</text><text x="276.0" y="143" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">próximo commit</text><line x1="342" y1="120.0" x2="418" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#f)"/><text x="380.0" y="108.0" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#1a1a1a">git commit</text><rect x="422" y="70" width="124" height="100" rx="8" fill="#e3ecfa" stroke="#2f5aa8" stroke-width="1.6"/><text x="484.0" y="100" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a">Guardado</text><text x="484.0" y="126" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">el historial,</text><text x="484.0" y="143" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">en tu equipo</text><line x1="550" y1="120.0" x2="626" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#f)"/><text x="588.0" y="108.0" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#1a1a1a">git push</text><rect x="630" y="70" width="124" height="100" rx="8" fill="#e2f3e4" stroke="#2e7d32" stroke-width="1.6"/><text x="692.0" y="100" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a">GitHub</text><text x="692.0" y="126" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">copia en internet:</text><text x="692.0" y="143" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">lo que se corrige</text><text x="276.0" y="38" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#555555">En tu equipo</text><path d="M6,50 L546,50" fill="none" stroke="#1a1a1a" stroke-width="1.2"/><text x="692.0" y="38" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">En internet</text><path d="M630,50 L754,50" fill="none" stroke="#1a1a1a" stroke-width="1.2"/><text x="380" y="206" text-anchor="middle" font-family="sans-serif" font-size="14" font-style="italic" fill="#1a1a1a">Lo que no llega al cuarto cuadro no está entregado.</text></svg>
