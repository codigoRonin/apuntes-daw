<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-label="Cómo leer git status: con cambios sin preparar falta git add; preparado falta git commit; guardado sin subir falta git push; al día y limpio está entregado"><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="760" height="310" fill="white"/><text x="124" y="26" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#555555">Dónde estás</text><text x="405" y="26" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#555555">Qué dice git status</text><text x="658" y="26" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#555555">Qué te falta</text><rect x="14" y="38" width="732" height="58" rx="8" fill="#fbe3e0" stroke="#b3261e" stroke-width="1.6"/><circle cx="38" cy="67.0" r="13" fill="white" stroke="#b3261e" stroke-width="1.6"/><text x="38" y="72.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">1</text><text x="60" y="72.0" text-anchor="start" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1a1a1a">Hay cambios sin preparar</text><text x="246" y="63.0" text-anchor="start" font-family="monospace" font-size="12" fill="#1a1a1a">Changes not staged for commit</text><text x="246" y="81.0" text-anchor="start" font-family="monospace" font-size="12" fill="#1a1a1a">Untracked files</text><text x="658" y="72.0" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1a1a1a">git add .</text><rect x="14" y="104" width="732" height="58" rx="8" fill="#fdf0cf" stroke="#9a6a00" stroke-width="1.6"/><circle cx="38" cy="133.0" r="13" fill="white" stroke="#9a6a00" stroke-width="1.6"/><text x="38" y="138.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">2</text><text x="60" y="138.0" text-anchor="start" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1a1a1a">Preparado, sin guardar</text><text x="246" y="138.0" text-anchor="start" font-family="monospace" font-size="12" fill="#1a1a1a">Changes to be committed</text><text x="658" y="138.0" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1a1a1a">git commit -m "..."</text><rect x="14" y="170" width="732" height="58" rx="8" fill="#e3ecfa" stroke="#2f5aa8" stroke-width="1.6"/><circle cx="38" cy="199.0" r="13" fill="white" stroke="#2f5aa8" stroke-width="1.6"/><text x="38" y="204.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">3</text><text x="60" y="204.0" text-anchor="start" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1a1a1a">Guardado, sin subir</text><text x="246" y="204.0" text-anchor="start" font-family="monospace" font-size="12" fill="#1a1a1a">Your branch is ahead of 'origin/main'</text><text x="658" y="204.0" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1a1a1a">git push</text><rect x="14" y="236" width="732" height="58" rx="8" fill="#e2f3e4" stroke="#2e7d32" stroke-width="1.6"/><circle cx="38" cy="265.0" r="13" fill="white" stroke="#2e7d32" stroke-width="1.6"/><text x="38" y="270.0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">4</text><text x="60" y="270.0" text-anchor="start" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1a1a1a">Entregado</text><text x="246" y="261.0" text-anchor="start" font-family="monospace" font-size="12" fill="#1a1a1a">Your branch is up to date with 'origin/main'</text><text x="246" y="279.0" text-anchor="start" font-family="monospace" font-size="12" fill="#1a1a1a">nothing to commit, working tree clean</text><text x="658" y="270.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a1a1a">nada: está en GitHub</text></svg>
