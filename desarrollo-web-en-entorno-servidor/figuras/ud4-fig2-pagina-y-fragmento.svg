<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-label="Dos formas de pedir la misma lista filtrada. Arriba, el formulario GET pide calendario.php y el servidor responde con el documento completo. Abajo, calendario.js intercepta el envío, pide la misma dirección con fragmento=1 y el mismo guion responde solo con el parcial de la lista, que el JavaScript coloca en su sitio. En los dos casos decide y pinta el servidor"><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="black"/></marker></defs><rect width="920" height="500" fill="white"/><text x="140" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold">En el navegador</text><text x="770" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold">En el servidor</text><text x="20" y="64" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="bold">A. La página entera: funciona siempre</text><rect x="20" y="80" width="240" height="130" fill="white" stroke="black" stroke-width="2.4"/><text x="140" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">El formulario GET</text><text x="140" y="132" text-anchor="middle" font-family="sans-serif" font-size="13">el navegador pide la página</text><text x="140" y="186" text-anchor="middle" font-family="sans-serif" font-size="13" font-style="italic">y la pinta entera otra vez</text><rect x="640" y="80" width="260" height="130" fill="white" stroke="black" stroke-width="2.4"/><text x="770" y="108" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold">calendario.php</text><text x="770" y="132" text-anchor="middle" font-family="sans-serif" font-size="13">lee, filtra, ordena y pagina</text><text x="770" y="154" text-anchor="middle" font-family="sans-serif" font-size="13">plantilla + parciales + layout</text><text x="770" y="186" text-anchor="middle" font-family="sans-serif" font-size="13" font-style="italic">el guion de siempre</text><path d="M260 120 L640 120" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#punta)"/><text x="450" y="110" text-anchor="middle" font-family="monospace" font-size="12">GET calendario.php?dificultad=alta</text><path d="M640 180 L260 180" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#punta)"/><text x="450" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" font-style="italic">documento completo: 2057 bytes</text><text x="20" y="264" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="bold">B. Solo el trozo que cambia: mejora con JavaScript</text><rect x="20" y="280" width="240" height="130" fill="#eeeeee" stroke="black" stroke-width="2.4"/><text x="140" y="308" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold">calendario.js</text><text x="140" y="332" text-anchor="middle" font-family="sans-serif" font-size="13">intercepta el envío y pide el trozo</text><text x="140" y="386" text-anchor="middle" font-family="sans-serif" font-size="13" font-style="italic">y lo coloca en #listado</text><rect x="640" y="280" width="260" height="130" fill="white" stroke="black" stroke-width="2.4"/><text x="770" y="308" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold">calendario.php</text><text x="770" y="332" text-anchor="middle" font-family="sans-serif" font-size="13">lee, filtra, ordena y pagina</text><text x="770" y="354" text-anchor="middle" font-family="sans-serif" font-size="13">solo el parcial listado, sin layout</text><text x="770" y="386" text-anchor="middle" font-family="sans-serif" font-size="13" font-style="italic">el mismo guion y la misma puerta</text><path d="M260 320 L640 320" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#punta)"/><text x="450" y="310" text-anchor="middle" font-family="monospace" font-size="12">GET …?dificultad=alta&amp;fragmento=1</text><path d="M640 380 L260 380" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#punta)"/><text x="450" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" font-style="italic">fragmento: 879 bytes</text><text x="460" y="462" text-anchor="middle" font-family="sans-serif" font-size="14" font-style="italic">En los dos casos decide y pinta el servidor, con el mismo parcial.</text><text x="460" y="484" text-anchor="middle" font-family="sans-serif" font-size="14" font-style="italic">El navegador solo cambia cuánto pide y dónde lo coloca.</text></svg>
