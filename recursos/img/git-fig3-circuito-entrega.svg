<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 225" role="img" aria-label="El circuito de una entrega: aceptar la tarea y clonar una vez; trabajar, subir y comprobar cada vez que avanzas"><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect width="760" height="225" fill="white"/><rect x="10" y="62" width="127" height="104" rx="8" fill="#fdf0cf" stroke="#9a6a00" stroke-width="1.6"/><circle cx="30" cy="84" r="13" fill="white" stroke="#9a6a00" stroke-width="1.6"/><text x="30" y="89" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">1</text><text x="50" y="89" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">Aceptar</text><text x="73.5" y="122" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">la tarea, en el</text><text x="73.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">aula de código</text><line x1="140" y1="114.0" x2="159" y2="114.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#f)"/><rect x="163" y="62" width="127" height="104" rx="8" fill="#e3ecfa" stroke="#2f5aa8" stroke-width="1.6"/><circle cx="183" cy="84" r="13" fill="white" stroke="#2f5aa8" stroke-width="1.6"/><text x="183" y="89" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">2</text><text x="203" y="89" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">Clonar</text><text x="226.5" y="122" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">el repositorio</text><text x="226.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">a tu equipo</text><line x1="293" y1="114.0" x2="312" y2="114.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#f)"/><rect x="316" y="62" width="127" height="104" rx="8" fill="#f1f1f1" stroke="#555555" stroke-width="1.6"/><circle cx="336" cy="84" r="13" fill="white" stroke="#555555" stroke-width="1.6"/><text x="336" y="89" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">3</text><text x="356" y="89" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">Trabajar</text><text x="379.5" y="122" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">y guardar en</text><text x="379.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">su carpeta</text><line x1="446" y1="114.0" x2="465" y2="114.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#f)"/><rect x="469" y="62" width="127" height="104" rx="8" fill="#e3ecfa" stroke="#2f5aa8" stroke-width="1.6"/><circle cx="489" cy="84" r="13" fill="white" stroke="#2f5aa8" stroke-width="1.6"/><text x="489" y="89" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">4</text><text x="509" y="89" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">Subir</text><text x="532.5" y="122" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">add, commit</text><text x="532.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">y push</text><line x1="599" y1="114.0" x2="618" y2="114.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#f)"/><rect x="622" y="62" width="127" height="104" rx="8" fill="#e2f3e4" stroke="#2e7d32" stroke-width="1.6"/><circle cx="642" cy="84" r="13" fill="white" stroke="#2e7d32" stroke-width="1.6"/><text x="642" y="89" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">5</text><text x="662" y="89" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">Comprobar</text><text x="685.5" y="122" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">en GitHub que</text><text x="685.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1a1a1a">ha llegado</text><path d="M10,44 L10,36 L290,36 L290,44" fill="none" stroke="#1a1a1a" stroke-width="1.2"/><text x="150.0" y="26" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#555555">una vez por tarea</text><path d="M316,44 L316,36 L749,36 L749,44" fill="none" stroke="#1a1a1a" stroke-width="1.2"/><text x="532.5" y="26" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#555555">cada vez que avanzas</text><path d="M685.5,170 L685.5,194 L379.5,194 L379.5,172" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#f)"/><text x="532.5" y="213" text-anchor="middle" font-family="sans-serif" font-size="13" font-style="italic" fill="#1a1a1a">y vuelta a empezar, hasta la fecha de entrega</text></svg>
